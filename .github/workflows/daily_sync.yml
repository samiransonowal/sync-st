name: Daily BigQuery & Sheets Sync Pipeline

on:
  schedule:
    # 9:00 AM IST is 3:30 AM UTC
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  sync-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore Credentials from Secrets
      env:
        SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        SHEETS_TOKEN_JSON: ${{ secrets.GCP_SHEETS_TOKEN_JSON }}
      run: |
        mkdir -p credentials/private
        if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
          echo "$SERVICE_ACCOUNT_JSON" > credentials/private/service_account.json
        fi
        if [ -n "$SHEETS_TOKEN_JSON" ]; then
          echo "$SHEETS_TOKEN_JSON" > credentials/private/sheets_token.json
        fi

    - name: Execute BigQuery Sync Pipeline
      run: |
        python3 scripts/bigquery_sync_pipeline.py
